services:
  - type: web
    name: chefia-recetas
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.1-flash-lite
      - key: INWORLD_API_KEY
        sync: false
      - key: INWORLD_VOICE_ID
        sync: false
      - key: INWORLD_MODEL_ID
        value: inworld-tts-1
